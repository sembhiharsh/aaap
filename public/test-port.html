<!DOCTYPE html>
<html>
<head>
  <script>
    function initMap() {
      const service = new google.maps.DistanceMatrixService();
      service.getDistanceMatrix({
        origins: [{ placeId: "ChIJW-3-Tj-ipBIRl81Hn49Y6uQ" }],
        destinations: ["Mataró, Maresme, Barcelona, Catalonia, Spain"],
        travelMode: google.maps.TravelMode.DRIVING,
      }, (response, status) => {
        document.getElementById('result').innerText = JSON.stringify({response, status}, null, 2);
      });
    }
  </script>
</head>
<body>
  <pre id="result">Loading...</pre>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCXzrcC6fJJ0z9CO9Plo1UxHyWrLUuFx6c&callback=initMap"></script>
</body>
</html>
